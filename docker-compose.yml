services:
  scrapper:
    build:
      context: .
      dockerfile: Dockerfile.scrapper
    container_name: linktracker-scrapper
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - BOT_BASE_URL=http://bot:8080
    networks:
      - linktracker-net

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: linktracker-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - PORT=8080
      - SCRAPPER_BASE_URL=http://scrapper:8081
    networks:
      - linktracker-net

networks:
  linktracker-net:
    driver: bridge