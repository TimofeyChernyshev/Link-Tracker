services:
  postgres:
    image: postgres:15-alpine
    container_name: linktracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: linktracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - linktracker-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  scrapper:
    build:
      context: .
      dockerfile: Dockerfile.scrapper
    container_name: linktracker-scrapper
    restart: unless-stopped
    ports:
      - "${SCRAPPER_PORT:-8081}:${SCRAPPER_PORT:-8081}"
    env_file:
      - .env.scrapper
    networks:
      - linktracker-net

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: linktracker-bot
    restart: unless-stopped
    ports:
      - "${BOT_PORT:-8080}:${BOT_PORT:-8080}"
    env_file:
      - .env.bot
    networks:
      - linktracker-net

volumes:
  postgres_data:

networks:
  linktracker-net:
    driver: bridge